<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F7F3E8">
  <meta name="description" content="Upload, filter, clean, and explore your CSV files in a calm, private workspace.">
  <title>Cella — Your data, made simple</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to data</a>
  <div id="app"></div>
  <input id="file-input" type="file" accept=".csv,.tsv,text/csv,text/tab-separated-values" multiple hidden>
  <dialog id="modal" aria-labelledby="modal-title"></dialog>
  <div id="toasts" role="status" aria-live="polite"></div>
  <div id="drop-overlay" hidden><div><span class="drop-plus">+</span><h2>Drop it like it’s data.</h2><p>Your next clear view starts here.</p></div></div>
  <script type="module" src="./app.mjs"></script>
</body>
</html>
